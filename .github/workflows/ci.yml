name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # Sepet/checkout akışı smoke testlerde koşulsun diye CI build'i
          # bayrak açık derlenir (canlı deploy bayraksız/kilitli kalır).
          NEXT_PUBLIC_CHECKOUT_ENABLED: "1"

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e
        env:
          # Sahte admin kimliği: login SAYFASININ form render etmesi için
          # (env yoksa sayfa "yapılandırılmamış" uyarısı basar, test form bulamaz).
          # Gerçek panele erişim yok; testler giriş DENEMEZ. Hash "ci-dummy"
          # bir parolanın bcrypt'i, hiçbir gerçek ortamda kullanılmaz.
          ADMIN_PASSWORD_HASH: $2b$10$1drEcOng0hSAxc.TVNCu.Om5yn0rLl1HQJNFmEBVoc.Rk/IV1IiZe
          ADMIN_SESSION_SECRET: ci-dummy-session-secret-0123456789abcdef
